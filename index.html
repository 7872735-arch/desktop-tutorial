<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #000;
    --surface: rgba(255,255,255,.06);
    --border: rgba(255,255,255,.1);
    --text: #fff;
    --text-secondary: rgba(255,255,255,.55);
    --accent: #fff;
    --red: #ff3b30;
    --bar-h: 60px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  html, body { width: 100%; height: 100%; background: var(--bg); font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif; overflow: hidden; color: var(--text); }

  /* ── Top bar ── */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: flex-end; justify-content: center;
    padding: calc(env(safe-area-inset-top, 44px) + 8px) 0 10px;
    background: linear-gradient(to bottom, rgba(0,0,0,.7) 0%, transparent 100%);
    gap: 28px;
  }
  .tab-btn {
    background: none; border: none; color: var(--text-secondary);
    font-size: 15px; font-weight: 500; letter-spacing: .3px; cursor: pointer;
    padding: 4px 0; position: relative; transition: color .2s;
  }
  .tab-btn.active { color: var(--text); font-weight: 700; }
  .tab-btn.active::after {
    content: ''; position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%);
    width: 18px; height: 2px; background: var(--accent); border-radius: 2px;
  }
  .topbar-search {
    position: absolute; right: 16px; bottom: 10px;
    background: none; border: none; color: var(--text); cursor: pointer; padding: 4px;
  }

  /* ── Feed ── */
  .feed {
    position: fixed; inset: 0;
    overflow-y: scroll; scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .feed::-webkit-scrollbar { display: none; }

  /* ── Video slide ── */
  .slide {
    width: 100%; height: 100vh;
    scroll-snap-align: start; scroll-snap-stop: always;
    position: relative; overflow: hidden; flex-shrink: 0;
  }
  .slide-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
  }
  .slide-bg::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.72) 0%, transparent 45%),
                linear-gradient(to bottom, rgba(0,0,0,.35) 0%, transparent 30%);
  }

  /* play indicator */
  .play-hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 5; pointer-events: none; opacity: 0; transition: opacity .25s;
  }
  .play-hint svg { width: 72px; height: 72px; filter: drop-shadow(0 2px 12px rgba(0,0,0,.6)); }
  .slide.paused .play-hint { opacity: 1; }

  /* Progress bar */
  .progress-bar {
    position: absolute; bottom: calc(var(--bar-h) + var(--safe-b) + 90px); left: 0; right: 0;
    height: 2px; background: rgba(255,255,255,.25); z-index: 20;
  }
  .progress-fill {
    height: 100%; background: var(--accent); border-radius: 2px;
    width: 0%; transition: width .3s linear;
  }

  /* ── Right actions ── */
  .actions {
    position: absolute; right: 12px; bottom: calc(var(--bar-h) + var(--safe-b) + 100px);
    z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 20px;
  }
  .action-item { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
  .action-icon {
    width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.1); border-radius: 50%;
    backdrop-filter: blur(8px); transition: transform .15s, background .15s;
  }
  .action-item:active .action-icon { transform: scale(.9); background: rgba(255,255,255,.2); }
  .action-icon svg { width: 22px; height: 22px; }
  .action-label { font-size: 11px; font-weight: 600; color: var(--text); letter-spacing: .3px; }
  .action-item.liked .action-icon { background: rgba(255,59,48,.25); }
  .action-item.liked svg { color: var(--red); }

  /* avatar + follow */
  .avatar-wrap { position: relative; margin-bottom: 6px; }
  .avatar {
    width: 46px; height: 46px; border-radius: 50%; border: 2px solid #fff;
    object-fit: cover; overflow: hidden; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #fff;
  }
  .follow-btn {
    position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
    width: 18px; height: 18px; background: var(--red); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    border: 1.5px solid #000; transition: transform .15s;
  }
  .follow-btn:active { transform: translateX(-50%) scale(.85); }
  .follow-btn svg { width: 10px; height: 10px; color: #fff; }
  .follow-btn.following { background: var(--text-secondary); }

  /* ── Bottom info ── */
  .info {
    position: absolute; left: 14px; right: 68px;
    bottom: calc(var(--bar-h) + var(--safe-b) + 96px);
    z-index: 20;
  }
  .info-name { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .info-name span { color: var(--text-secondary); font-weight: 400; margin-left: 2px; }
  .info-desc { font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.85); margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .info-music {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: rgba(255,255,255,.7);
  }
  .info-music svg { width: 13px; height: 13px; animation: spin 4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .music-marquee { overflow: hidden; max-width: 200px; white-space: nowrap; }
  .music-marquee span { display: inline-block; animation: marquee 8s linear infinite; }
  @keyframes marquee { 0%{transform:translateX(0)} 50%{transform:translateX(-60px)} 100%{transform:translateX(0)} }

  /* ── Music disc ── */
  .disc-wrap {
    position: absolute; right: 14px; bottom: calc(var(--bar-h) + var(--safe-b) + 14px);
    z-index: 20;
  }
  .disc {
    width: 46px; height: 46px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    animation: disc-spin 6s linear infinite;
    box-shadow: 0 0 0 6px rgba(255,255,255,.06);
  }
  @keyframes disc-spin { to { transform: rotate(360deg); } }

  /* ── Bottom nav ── */
  .bottomnav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    height: calc(var(--bar-h) + var(--safe-b));
    padding-bottom: var(--safe-b);
    background: rgba(0,0,0,.85);
    backdrop-filter: blur(20px) saturate(1.8);
    border-top: .5px solid var(--border);
    display: flex; align-items: center; justify-content: space-around;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer; padding: 6px 0; transition: opacity .15s;
  }
  .nav-item:active { opacity: .6; }
  .nav-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
  .nav-icon svg { width: 22px; height: 22px; }
  .nav-label { font-size: 10px; font-weight: 600; color: var(--text-secondary); letter-spacing: .3px; }
  .nav-item.active .nav-label, .nav-item.active svg { color: var(--text); }
  .nav-item.active .nav-label { color: var(--text); }

  /* create button */
  .nav-create {
    flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 4px 0;
  }
  .create-btn {
    display: flex; align-items: center; justify-content: center;
    background: var(--text); border-radius: 10px;
    width: 42px; height: 28px; position: relative;
    box-shadow: 0 0 0 3px rgba(255,59,48,.5), 0 0 0 6px rgba(0,212,255,.3);
  }
  .create-btn svg { width: 16px; height: 16px; color: #000; }

  /* ── Comments sheet ── */
  .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .sheet-overlay.open { opacity: 1; pointer-events: all; }
  .sheet {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 201;
    background: #1c1c1e; border-radius: 20px 20px 0 0;
    transform: translateY(100%); transition: transform .35s cubic-bezier(.32,0,.15,1);
    max-height: 70vh; display: flex; flex-direction: column;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 36px; height: 4px; background: rgba(255,255,255,.2); border-radius: 2px;
    margin: 10px auto 6px;
  }
  .sheet-title { text-align: center; font-size: 15px; font-weight: 700; padding: 6px 0 10px; border-bottom: .5px solid var(--border); }
  .sheet-body { overflow-y: auto; padding: 12px 16px; flex: 1; }
  .comment { display: flex; gap: 10px; margin-bottom: 18px; }
  .comment-avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; }
  .comment-content { flex: 1; }
  .comment-name { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 3px; }
  .comment-text { font-size: 14px; line-height: 1.5; }
  .comment-meta { display: flex; gap: 14px; margin-top: 5px; }
  .comment-meta span { font-size: 11px; color: var(--text-secondary); }
  .comment-like { display: flex; align-items: center; gap: 4px; }
  .sheet-input {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; padding-bottom: calc(10px + var(--safe-b));
    border-top: .5px solid var(--border);
  }
  .input-field {
    flex: 1; background: rgba(255,255,255,.1); border: none; border-radius: 20px;
    padding: 9px 14px; color: var(--text); font-size: 14px; outline: none;
    font-family: inherit;
  }
  .input-field::placeholder { color: var(--text-secondary); }
  .send-btn {
    background: none; border: none; color: rgba(255,255,255,.4);
    font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }

  /* ── Like burst ── */
  .heart-burst {
    position: fixed; pointer-events: none; z-index: 300;
    font-size: 64px; transform: scale(0); opacity: 0;
    transition: transform .15s, opacity .15s;
    filter: drop-shadow(0 0 12px rgba(255,59,48,.8));
  }
  .heart-burst.show { transform: scale(1.2); opacity: 1; }
  .heart-burst.hide { transform: scale(1.5); opacity: 0; transition: transform .3s, opacity .3s; }
</style>

      <div class="action-item" onclick="shareAction(this)">
        <div class="action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </div>
        <span class="action-label">${v.shares}</span>
      </div>
    </div>
    <div class="info">
      <div class="info-name">@${v.user} <span>${v.name}</span></div>
      <div class="info-desc">${v.desc}</div>
      <div class="info-music">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <div class="music-marquee"><span>${v.musicEmoji} ${v.music}</span></div>
      </div>
    </div>
    <div class="disc-wrap"><div class="disc">${v.avatar}</div></div>
  `;
  el.addEventListener('click', (e) => {
    if (e.target.closest('.actions') || e.target.closest('.disc-wrap')) return;
    togglePause(el, i);
  });
  el.addEventListener('dblclick', (e) => {
    if (e.target.closest('.actions')) return;
    showHeart(e.clientX, e.clientY);
    if (!likedSlides.has(i)) toggleLike(e, i);
  });
  return el;
}

videos.forEach((v, i) => feed.appendChild(buildSlide(v, i)));

// Progress simulation
let currentSlide = 0;
function startProgress(i) {
  clearInterval(progressIntervals[i]);
  const fill = document.getElementById(`prog-${i}`);
  if (!fill) return;
  fill.style.width = '0%';
  let w = 0;
  progressIntervals[i] = setInterval(() => {
    w += .5;
    fill.style.width = Math.min(w, 100) + '%';
    if (w >= 100) { clearInterval(progressIntervals[i]); scrollToNext(i); }
  }, 150);
}
function stopProgress(i) { clearInterval(progressIntervals[i]); }
function scrollToNext(i) {
  const slides = feed.querySelectorAll('.slide');
  if (i + 1 < slides.length) slides[i + 1].scrollIntoView({ behavior: 'smooth' });
}

const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    const i = +e.target.dataset.index;
    if (e.isIntersecting) { currentSlide = i; startProgress(i); }
    else stopProgress(i);
  });
}, { threshold: .6 });
feed.querySelectorAll('.slide').forEach(s => observer.observe(s));

// Pause
let pausedSlides = new Set();
function togglePause(el, i) {
  if (pausedSlides.has(i)) {
    pausedSlides.delete(i);
    el.classList.remove('paused');
    startProgress(i);
  } else {
    pausedSlides.add(i);
    el.classList.add('paused');
    stopProgress(i);
  }
}

// Like
function toggleLike(e, i) {
  e.stopPropagation();
  const item = document.getElementById(`like-${i}`);
  const icon = item.querySelector('svg');
  if (likedSlides.has(i)) {
    likedSlides.delete(i);
    item.classList.remove('liked');
    icon.setAttribute('fill', 'none');
    icon.setAttribute('stroke', 'currentColor');
  } else {
    likedSlides.add(i);
    item.classList.add('liked');
    icon.setAttribute('fill', '#ff3b30');
    icon.setAttribute('stroke', '#ff3b30');
  }
}

// Follow
function toggleFollow(i) {
  const btn = document.getElementById(`follow-${i}`);
  if (followedUsers.has(i)) {
    followedUsers.delete(i);
    btn.classList.remove('following');
    btn.innerHTML = `<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="2" x2="5" y2="8"/><line x1="2" y1="5" x2="8" y2="5"/></svg>`;
  } else {
    followedUsers.add(i);
    btn.classList.add('following');
    btn.innerHTML = `<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="2,5 4.5,7.5 8.5,3"/></svg>`;
  }
}

// Heart burst
const heartBurst = document.getElementById('heartBurst');
function showHeart(x, y) {
  heartBurst.style.left = (x - 32) + 'px';
  heartBurst.style.top = (y - 32) + 'px';
  heartBurst.classList.remove('hide');
  heartBurst.classList.add('show');
  setTimeout(() => { heartBurst.classList.remove('show'); heartBurst.classList.add('hide'); }, 600);
}

// Share
function shareAction(el) {
  const icon = el.querySelector('.action-icon');
  icon.style.background = 'rgba(52,199,89,.3)';
  setTimeout(() => { icon.style.background = ''; }, 800);
}

// Comments sheet
function openSheet(i) {
  const v = videos[i];
  const comments = commentSets[i] || [];
  document.getElementById('sheet-title').textContent = `评论 ${v.comments}`;
  const body = document.getElementById('sheet-body');
  body.innerHTML = comments.map(c => `
    <div class="comment">
      <div class="comment-avatar" style="background:linear-gradient(135deg,#667eea,#764ba2)">${c.avatar}</div>
      <div class="comment-content">
        <div class="comment-name">${c.name}</div>
        <div class="comment-text">${c.text}</div>
        <div class="comment-meta">
          <span>${c.time}</span>
          <span class="comment-like">❤️ ${c.likes}</span>
          <span>回复</span>
        </div>
      </div>
    </div>
  `).join('');
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  stopProgress(currentSlide);
}
function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  if (!pausedSlides.has(currentSlide)) startProgress(currentSlide);
}

// Tab
function setTab(btn, tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// Nav
function setNav(item) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  item.classList.add('active');
}
</script>
</body>
</html>
