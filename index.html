<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iVPT C級 越南語學習助理</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: rgba(255,255,255,.08);
    --accent: #4f8ef7;
    --accent2: #a78bfa;
    --green: #34d399;
    --red: #f87171;
    --yellow: #fbbf24;
    --text: #e2e8f0;
    --muted: #64748b;
    --radius: 12px;
  }
  html, body { height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }

  /* Layout */
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* Sidebar */
  .sidebar {
    width: 260px; min-width: 260px; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 20px 16px;
    gap: 20px;
  }
  .logo { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: .5px; }
  .logo span { color: var(--accent); }
  .logo small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); margin-top: 2px; }

  .status-bar {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2); border-radius: 8px; padding: 8px 12px;
    font-size: 12px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.error { background: var(--red); }
  #status-text { color: var(--muted); }

  .section-label {
    font-size: 10px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1.5px;
  }

  .quick-btns { display: flex; flex-direction: column; gap: 6px; }
  .qbtn {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--text); cursor: pointer;
    font-size: 13px; text-align: left; transition: all .15s;
  }
  .qbtn:hover { background: var(--surface2); border-color: var(--accent); }
  .qbtn .icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
  .qbtn .label { flex: 1; }
  .qbtn .badge {
    font-size: 10px; padding: 2px 6px; border-radius: 4px;
    background: rgba(79,142,247,.15); color: var(--accent); font-weight: 600;
  }

  /* Context tracker */
  .context-track { background: var(--surface2); border-radius: 8px; padding: 12px; }
  .context-track .ct-title { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .ct-items { display: flex; flex-direction: column; gap: 4px; }
  .ct-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; padding: 4px 6px; border-radius: 6px;
    transition: background .15s;
  }
  .ct-item.active { background: rgba(79,142,247,.12); color: var(--accent); }
  .ct-item .ct-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
  .ct-item.active .ct-dot { background: var(--accent); }

  /* Settings */
  .settings { display: flex; flex-direction: column; gap: 8px; }
  .settings input, .settings select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 7px 10px; font-size: 12px;
  }
  .settings input:focus, .settings select:focus {
    outline: none; border-color: var(--accent);
  }
  .settings label { font-size: 11px; color: var(--muted); margin-bottom: 2px; display: block; }

  .btn-connect {
    width: 100%; padding: 8px; border-radius: 6px; border: none;
    background: var(--accent); color: #fff; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: opacity .15s;
  }
  .btn-connect:hover { opacity: .85; }

  /* Main chat */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .chat-header {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .mode-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
    background: rgba(79,142,247,.1); color: var(--accent); border: 1px solid rgba(79,142,247,.2);
  }
  .chat-title { font-size: 14px; color: var(--muted); }

  .messages {
    flex: 1; overflow-y: auto; padding: 24px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg { display: flex; gap: 12px; max-width: 85%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.assistant { align-self: flex-start; }

  .avatar {
    width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .msg.user .avatar { background: var(--accent); }
  .msg.assistant .avatar { background: var(--surface2); border: 1px solid var(--border); }

  .bubble {
    padding: 12px 16px; border-radius: 12px; font-size: 14px;
    line-height: 1.7; word-break: break-word;
  }
  .msg.user .bubble { white-space: pre-wrap; }
  .msg.user .bubble {
    background: var(--accent); color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant .bubble {
    background: var(--surface); border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .bubble table { border-collapse: collapse; margin: 8px 0; width: 100%; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; font-size: 13px; text-align: left; }
  .bubble th { background: var(--surface2); color: var(--accent); }
  .bubble code { background: var(--surface2); padding: 1px 5px; border-radius: 4px; font-size: 12px; font-family: monospace; }
  .bubble strong { color: var(--yellow); }
  .bubble em { color: var(--accent2); }
  .bubble h2,.bubble h3 { color: var(--accent); font-size: 14px; font-weight: 700; margin: 10px 0 4px; }
  .bubble h4,.bubble h5 { color: var(--accent2); font-size: 13px; font-weight: 700; margin: 8px 0 4px; }
  .bubble ul,.bubble ol { padding-left: 20px; margin: 4px 0; }
  .bubble li { margin: 2px 0; }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .bubble pre { background: var(--surface2); border-radius: 6px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; }
  .bubble pre code { background: none; padding: 0; }
  .bubble .hl { color: var(--yellow); font-weight: 700; }
  .bubble .md-div { color: var(--accent); font-weight: 700; font-size: 13px; margin: 10px 0 4px; letter-spacing: .5px; }

  /* Memory counter */
  .mem-track { background: var(--surface2); border-radius: 8px; padding: 10px 12px; }
  .mem-info { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 6px; }
  .mem-info span:first-child { color: var(--text); font-weight: 600; }
  .mem-label { color: var(--muted); }
  .mem-bar-wrap { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .mem-bar { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width .3s; }

  .typing { display: flex; gap: 4px; align-items: center; padding: 12px 16px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

  /* Welcome */
  .welcome {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 20px; padding: 40px; text-align: center;
  }
  .welcome-icon { font-size: 56px; }
  .welcome h2 { font-size: 22px; font-weight: 700; }
  .welcome p { color: var(--muted); font-size: 14px; line-height: 1.8; max-width: 420px; }
  .welcome-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; width: 100%; max-width: 480px; }
  .wcard {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; text-align: left; cursor: pointer;
    transition: all .15s;
  }
  .wcard:hover { border-color: var(--accent); background: var(--surface2); }
  .wcard .wc-icon { font-size: 20px; margin-bottom: 6px; }
  .wcard .wc-cmd { font-size: 13px; font-weight: 600; color: var(--accent); }
  .wcard .wc-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Input */
  .input-area {
    padding: 16px 24px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: flex-end;
  }
  .input-wrap { flex: 1; position: relative; }
  textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 12px 16px;
    font-size: 14px; resize: none; font-family: inherit;
    line-height: 1.5; max-height: 140px; overflow-y: auto;
    transition: border-color .15s;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  .send-btn {
    width: 42px; height: 42px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0; transition: opacity .15s;
    margin-bottom: 1px;
  }
  .send-btn:hover { opacity: .85; }
  .send-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* Responsive */
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .msg { max-width: 95%; }
    .welcome-cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div>
      <div class="logo">🇻🇳 越南語助理<small>iVPT C 級備考系統</small></div>
    </div>

    <div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let history = [];
let isLoading = false;
let contextIdx = parseInt(localStorage.getItem('ivpt_context') || '0');

const MAX_HISTORY = 20;

const CONTEXTS = [
  { name: '日常社交', icon: '🏠', desc: '家庭、飲食、出行、人際溝通' },
  { name: '職場商務', icon: '💼', desc: '會議、合約、求職、商業談判' },
  { name: '社會文化', icon: '🎭', desc: '越南節慶、時事政策、地理歷史' },
];

const SYSTEM_PROMPT = `你是一位專業的 iVPT 越南語檢定 C 級學習助理，以繁體中文搭配越文進行教學。

你有四種工作模式，根據用戶輸入自動切換：

━━ 模式一：早晨學習模式 ━━
觸發條件：用戶輸入「早安」
執行內容：
1. 推送 5 個 iVPT C 級核心詞彙，格式：
   • 越文（詞性）：中文意思
     例句：[越文例句] → [中文翻譯]
2. 提供一則越南時事短文（150字左右），標注 3 個重要 C 級詞彙（用【】標記）
3. 附上 3 道短文理解題（含解答）

━━ 模式二：口說批改模式 ━━
觸發條件：用戶輸入越文句子（不是以下關鍵字）
執行內容：
1. ✅ 正確之處（簡短說明）
2. ⚠️ 需要修正的地方（列出錯誤 + 原因）
3. 💡 C 級建議版本（更地道、更正式的表達）
4. 📌 補充：該句型在 iVPT C 級的考試重點

━━ 模式三：模擬考模式 ━━
觸發條件：用戶輸入「模擬考」
執行內容：生成完整 iVPT C 級模擬題組：
【一、詞彙語法】5 題選擇題（A/B/C/D）
【二、閱讀理解】一篇 200 字短文 + 4 道題目
【三、情境寫作】一道寫作題目（要求用越文作答 80-120 字）
最後附上所有答案與解析

━━ 模式四：今日主題推薦模式 ━━
觸發條件：用戶輸入「今天學什麼」
系統會告知目前語境（由外部傳入），請按照語境執行：
若語境為「日常社交」：推薦家庭/飲食/出行相關主題
若語境為「職場商務」：推薦工作場景相關主題
若語境為「社會文化」：推薦越南文化/時事相關主題

執行內容：
1. 主題名稱與背景介紹（3-4句）
2. 10 個核心詞彙（格式同模式一）
3. 2 段情境對話（越文 + 中文翻譯）

回應請用清晰的段落排版，適當使用符號（•、━、【】）讓內容易於閱讀。`;

// ── Markdown Renderer ──────────────────────────────────────────────────────
function inlineFormat(text) {
  return text
    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/_(.+?)_/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/【(.+?)】/g, '<span class="hl">$1</span>');
}

function renderTable(rows) {
  let html = '<table>';
  let isHeader = true;
  for (const row of rows) {
    if (/^\|[-:\s|]+\|$/.test(row)) { isHeader = false; continue; }
    const cells = row.split('|').slice(1, -1);
    const tag = isHeader ? 'th' : 'td';
    html += '<tr>' + cells.map(c => `<${tag}>${inlineFormat(c.trim())}</${tag}>`).join('') + '</tr>';
    if (isHeader) isHeader = false;
  }
  return html + '</table>';
}

function renderMarkdown(raw) {
  // Escape HTML
  let text = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // Fenced code blocks
  text = text.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, code) =>
    `<pre><code>${code.trimEnd()}</code></pre>`);

  const lines = text.split('\n');
  const out = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    // Headings
    const hMatch = line.match(/^(#{1,4}) (.+)/);
    if (hMatch) {
      const tag = `h${Math.min(hMatch[1].length + 1, 5)}`;
      out.push(`<${tag}>${inlineFormat(hMatch[2])}</${tag}>`);
      i++; continue;
    }

    // ━━ section divider
    if (/^━━/.test(line)) {
      out.push(`<div class="md-div">${inlineFormat(line)}</div>`);
      i++; continue;
    }

    // Horizontal rule
    if (/^-{3,}$/.test(line)) {
      out.push('<hr>');
      i++; continue;
    }

    // Table block
    if (/^\|/.test(line)) {
      const tableLines = [];
      while (i < lines.length && /^\|/.test(lines[i])) tableLines.push(lines[i++]);
      out.push(renderTable(tableLines));
      continue;
    }

    // Unordered list
    if (/^[•\-\*] /.test(line)) {
      const items = [];
      while (i < lines.length && /^[•\-\*] /.test(lines[i]))
        items.push(`<li>${inlineFormat(lines[i++].replace(/^[•\-\*] /, ''))}</li>`);
      out.push(`<ul>${items.join('')}</ul>`);
      continue;
    }

    // Ordered list
    if (/^\d+\. /.test(line)) {
      const items = [];
      while (i < lines.length && /^\d+\. /.test(lines[i]))
        items.push(`<li>${inlineFormat(lines[i++].replace(/^\d+\. /, ''))}</li>`);
      out.push(`<ol>${items.join('')}</ol>`);
      continue;
    }

    // Empty line
    if (line.trim() === '') { out.push('<br>'); i++; continue; }

    // Normal line
    out.push(inlineFormat(line) + '<br>');
    i++;
  }

  return out.join('');
}

// ── History Trim ───────────────────────────────────────────────────────────
function trimHistory() {
  if (history.length > MAX_HISTORY)
    history = history.slice(history.length - MAX_HISTORY);
  const el = document.getElementById('mem-count');
  const bar = document.getElementById('mem-bar');
  if (el) el.textContent = `${history.length} / ${MAX_HISTORY}`;
  if (bar) bar.style.width = `${(history.length / MAX_HISTORY) * 100}%`;
}

// ── Retry Fetch ────────────────────────────────────────────────────────────
async function fetchWithRetry(url, options, maxRetries = 3) {
  let lastErr;
  for (let attempt = 0; attempt < maxRetries; attempt++) {
    try {
      const res = await fetch(url, options);
      if (res.ok) return res;
      throw new Error(`HTTP ${res.status}`);
    } catch (err) {
      lastErr = err;
      if (attempt < maxRetries - 1) {
        setStatus('retrying', attempt + 1, maxRetries);
        await new Promise(r => setTimeout(r, Math.pow(2, attempt) * 1000));
      }
    }
  }
  throw lastErr;
}

// ── Connection ─────────────────────────────────────────────────────────────
async function checkConnection() {
  const url = document.getElementById('ollama-url').value.trim();
  setStatus('checking');
  try {
    const res = await fetch(`${url}/api/tags`, { signal: AbortSignal.timeout(5000) });
    if (res.ok) {
      setStatus('online');
      return true;
    }
  } catch (e) {}
  setStatus('error');
  return false;
}

function setStatus(state, attempt, max) {
  const dot = document.getElementById('dot');
  const text = document.getElementById('status-text');
  dot.className = 'dot';
  if (state === 'online')    { dot.classList.add('online'); text.textContent = '已連線'; }
  else if (state === 'error')    { dot.classList.add('error');  text.textContent = '連線失敗'; }
  else if (state === 'retrying') { dot.classList.add('error');  text.textContent = `重試 ${attempt}/${max}…`; }
  else { text.textContent = '檢查中…'; }
}

// ── Mode Detection ─────────────────────────────────────────────────────────
function detectMode(text) {
  const t = text.trim();
  if (t === '早安') return 'morning';
  if (t === '模擬考') return 'exam';
  if (t === '今天學什麼') return 'suggest';
  // Detect Vietnamese: common Vietnamese characters
  if (/[àáâãèéêìíòóôõùúýăđơưạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịọỏốồổỗộớờởỡợụủứừửữựỳỷỹỵ]/i.test(t)) return 'correction';
  return 'general';
}

function getModeLabel(mode) {
  const map = {
    morning: ['🌅 晨間模式', '推送今日詞彙與越南新聞'],
    exam: ['📝 模擬考模式', '生成 iVPT C 級完整題組'],
    suggest: ['🎯 今日推薦模式', `語境：${CONTEXTS[contextIdx].icon} ${CONTEXTS[contextIdx].name}`],
    correction: ['✍️ 口說批改模式', '分析句子並提供 C 級建議'],
    general: ['💬 一般問答', '自由問答模式'],
  };
  return map[mode] || map.general;
}

// ── Context Rotation ───────────────────────────────────────────────────────
function updateContextUI() {
  document.querySelectorAll('.ct-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === contextIdx);
  });
}

function advanceContext() {
  contextIdx = (contextIdx + 1) % 3;
  localStorage.setItem('ivpt_context', contextIdx);
  updateContextUI();
}

// ── Messaging ──────────────────────────────────────────────────────────────
async function sendQuick(text) {
  document.getElementById('input').value = text;
  await sendMessage();
}

function focusInput() {
  document.getElementById('input').focus();
}

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;

  // Hide welcome
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  input.value = '';
  autoResize(input);

  const mode = detectMode(text);
  const [modeLabel, modeDesc] = getModeLabel(mode);
  document.getElementById('mode-badge').textContent = modeLabel;
  document.getElementById('mode-desc').textContent = modeDesc;

  appendMessage('user', text);

  // Build user message with context injection for suggest mode
  let userContent = text;
  if (mode === 'suggest') {
    const ctx = CONTEXTS[contextIdx];
    userContent = `今天學什麼（當前語境：${ctx.name}，說明：${ctx.desc}）`;
    advanceContext();
  }

  history.push({ role: 'user', content: userContent });
  trimHistory();

  const url = document.getElementById('ollama-url').value.trim();
  const model = document.getElementById('ollama-model').value.trim();

  isLoading = true;
  document.getElementById('send-btn').disabled = true;

  const typingEl = appendTyping();

  try {
    const messages = [
      { role: 'system', content: SYSTEM_PROMPT },
      ...history
    ];

    const res = await fetchWithRetry(`${url}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, messages, stream: true })
    });

    setStatus('online');
    typingEl.remove();

    const assistantEl = appendMessage('assistant', '');
    const bubble = assistantEl.querySelector('.bubble');

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const lines = decoder.decode(value).split('\n');
      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const data = JSON.parse(line);
          if (data.message?.content) {
            fullText += data.message.content;
            // plain text during streaming for performance
            bubble.textContent = fullText;
            scrollToBottom();
          }
        } catch {}
      }
    }

    // Switch to full Markdown render after streaming completes
    bubble.innerHTML = renderMarkdown(fullText);
    scrollToBottom();

    history.push({ role: 'assistant', content: fullText });
    trimHistory();

  } catch (err) {
    typingEl.remove();
    setStatus('error');
    appendMessage('assistant', `⚠️ 連線失敗（已重試 3 次）：${err.message}\n\n請確認：\n• Ollama 是否已啟動（ollama serve）\n• API 網址是否正確\n• 模型是否已下載（ollama pull ${model}）`);
  }

  isLoading = false;
  document.getElementById('send-btn').disabled = false;
  input.focus();
}

// ── DOM Helpers ────────────────────────────────────────────────────────────
function appendMessage(role, text) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const content = role === 'user' ? escHtml(text) : renderMarkdown(text);
  div.innerHTML = `
    <div class="avatar">${role === 'user' ? '你' : '🇻🇳'}</div>
    <div class="bubble">${content}</div>
  `;
  msgs.appendChild(div);
  scrollToBottom();
  return div;
}

function appendTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = `
    <div class="avatar">🇻🇳</div>
    <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
  `;
  msgs.appendChild(div);
  scrollToBottom();
  return div;
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function scrollToBottom() {
  const msgs = document.getElementById('messages');
  msgs.scrollTop = msgs.scrollHeight;
}

// ── Input Helpers ──────────────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

// ── Init ───────────────────────────────────────────────────────────────────
updateContextUI();
trimHistory();
checkConnection();
</script>
</body>
</html>
